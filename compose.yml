version: '3.4'
services:
  localstack:
    image: localstack/localstack:3.0.2
    ports:
      - '4566:4566' # LocalStack Gateway
      - '4510-4559:4510-4559' # external services port range
    env_file:
      - 'compose/aws.env'
    environment:
      DEBUG: ${DEBUG:-1}
      LS_LOG: WARN # Localstack DEBUG Level
      SERVICES: s3,sqs,sns,firehose
      LOCALSTACK_HOST: 127.0.0.1
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test 
    volumes:
      - '${TMPDIR:-/tmp}/localstack:/var/lib/localstack'
      - ./compose/start-localstack.sh:/etc/localstack/init/ready.d/start-localstack.sh
    healthcheck:
      test: ['CMD', 'curl', 'localhost:4566']
      interval: 5s
      start_period: 5s
      retries: 3
    networks:
      - cdp-tenant

  redis:
    image: redis:7.2.3-alpine3.18
    ports:
      - '6379:6379'
    restart: always
    networks:
      - cdp-tenant

  mongodb:
    image: mongo:6.0.13
    networks:
      - cdp-tenant
    ports:
      - '27017:27017'
    volumes:
      - mongodb-data:/data
    restart: always

  ################################################################################

  your-frontend:
    build: ./
    ports:
      - '3000:3000'
    links:
      - 'localstack:localstack'
      - 'redis:redis'
    depends_on:
      localstack:
        condition: service_healthy
      redis:
        condition: service_started
    env_file:
      - 'compose/aws.env'
    environment:
      API_BASE_URL: http://your-backend:8080
      AZURE_CLIENT_SECRET: ${AZURE_CLIENT_SECRET}
      PORT: 3000
      NODE_ENV: development
      REDIS_HOST: redis
      LOCALSTACK_ENDPOINT: http://localstack:4566
      USE_SINGLE_INSTANCE_CACHE: true
      AWS_PROFILE: ${AWS_PROFILE:-default}
    volumes:
      - ./:/app # Mount the current directory to /app
      - /app/node_modules # Prevent overwriting node_modules
      - ${HOME}/.aws:/home/node/.aws:ro    # real SSO credentials
    networks:
      - cdp-tenant

  your-backend:
    image: defradigital/assurance-api
    ports:
      - '8085:8080'
    links:
      - 'localstack:localstack'
      - 'mongodb:mongodb'
    depends_on:
      localstack:
        condition: service_healthy
      mongodb:
        condition: service_started
    env_file:
      - 'compose/aws.env'
    environment:
      PORT: 8085
      NODE_ENV: development
      AZURE__TENANTID: "6f504113-6b64-43f2-ade9-242e05780007"
      AZURE__CLIENTID: "a741690c-cc36-410d-a83a-b64a1bbc635a"
      LOCALSTACK_ENDPOINT: http://localstack:4566
      Mongo__DatabaseUri: mongodb://mongodb:27017
    networks:
      - cdp-tenant

volumes:
  mongodb-data:

networks:
  cdp-tenant:
    driver: bridge
